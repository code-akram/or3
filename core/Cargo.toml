[package]
name = "game-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust core compiled to wasm32 (SIMD + threads): fixed-step simulation, pose buffers, Rapier physics."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
rapier3d = "=0.36.1"
