# Provenance: upstream sources (proposal from Phase 0 spike 1; format open, NOTES.md §17 q3).
#
# One [[source]] per upstream archive or tool whose data reaches a shipped asset.
# Shipped assets reference sources by `id` in [[asset]] entries (see the
# example at the bottom), so the CI audit can check: every shipped file has an
# entry, every entry's sources exist, every licence is on the allow-list
# (NOTES.md §14), and the sha256 of each re-fetched archive still matches.

[[source]]
id = "mpfb2-2.0.18"
kind = "tool+data"
url = "https://extensions.blender.org/add-ons/mpfb/"
repo = "https://github.com/makehumancommunity/mpfb2"
version = "2.0.18 (build 20261010)"
author = "MakeHuman Community (Joel Palmius, maintainer)"
licence_code = "GPL-3.0-or-later"          # code only runs offline; never shipped
licence_data = "CC0-1.0"                    # base mesh, targets, rigs, weights: LICENSE.md §C
licence_evidence = "https://github.com/makehumancommunity/mpfb2/blob/master/LICENSE.md"
audit = "provenance/audit_makehuman.py: 1538 files, 0 flagged (2026-10-12)"
notes = "game_engine rig JSON and target .gz files carry no per-file header; covered by LICENSE.md §C."

