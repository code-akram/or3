<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser skeleton (m0 spike 4)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07070b; color: #d8d8e0; overflow: hidden; }
      body { font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
      canvas#view { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; left: 8px; top: 8px; padding: 6px 8px; background: rgba(0,0,0,.6);
             border-radius: 4px; white-space: pre; pointer-events: none; max-width: 46ch; }
      #graph { position: fixed; right: 8px; top: 8px; width: 360px; height: 120px;
               background: rgba(0,0,0,.6); border-radius: 4px; }
      #fatal { position: fixed; inset: 0; display: none; padding: 24px; background: #200; color: #fcc; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="graph" width="720" height="240"></canvas>
    <div id="hud">booting…</div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
