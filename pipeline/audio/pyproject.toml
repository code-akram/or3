[project]
name = "audio-pipeline"
version = "0.1.0"
description = "Programmatic audio pipeline: fetch, analyse, clean, design, spatialise, master (NOTES.md §12)"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "audiopipe"
