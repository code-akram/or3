# Source selection for the spike-7 audio batch (NOTES.md §12, §18 item 7).
# Each entry is fetched by `audiopipe.fetch`, which re-checks the licence against
# provenance/licences.json at fetch time and writes one record per file to
# provenance/audio.jsonl. `role` says what the pipeline uses the file for.
#
# Candidate search (reproducible):
#   uv run python -I -m audiopipe.search '' --geo 35.6938,139.7034,4 --filter 'duration:[60 TO 1200]' --sort downloads_desc
#   uv run python -I -m audiopipe.search 'dress shoes footsteps concrete'
#   IA: collection:radio-aporee-maps AND (tokyo OR shinjuku OR shibuya ...) via advancedsearch.php

